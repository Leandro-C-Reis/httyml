[package]
name = "httyml-daemon"
version = "0.1.0"
edition = "2021"

[lib]
name = "httyml_daemon"
path = "src/lib.rs"

[[bin]]
name = "httyml-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
